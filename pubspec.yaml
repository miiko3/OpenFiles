name: openfiles
description: Android file manager and editor that opens and edits every file type in place.
publish_to: 'none'
version: 1.0.6+7

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  archive: ^4.5.1
  xml: ^7.1.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  collection: ^1.19.1
  image: ^4.12.0
  pdf: ^3.13.1
  printing: ^5.15.1
  url_launcher: ^6.3.3
  pdfrx: ^2.6.5
  fl_chart: ^1.2.0
  flutter_markdown: ^0.7.7+1
  flutter_highlight: ^0.7.0
  file_picker: ^13.1.0
  video_player: ^2.14.1
  just_audio: ^0.10.6
  photo_view: ^0.15.0
  share_plus: ^13.3.1
  path: ^1.9.1
  mime: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png
    - assets/fonts/roboto-regular.ttf
    - assets/fonts/roboto-bold.ttf
    - assets/fonts/roboto-italic.ttf
    - assets/fonts/roboto-bolditalic.ttf